version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: cybershield-db
    environment:
      POSTGRES_DB: cybershield_db
      POSTGRES_USER: cybershield_user
      POSTGRES_PASSWORD: cybershield_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./database/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield_user -d cybershield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: cybershield-go-core
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=cybershield_user
      - DB_PASSWORD=cybershield_secure_password_2026
      - DB_NAME=cybershield_db
    depends_on:
      database:
        condition: service_healthy

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: cybershield-python-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=cybershield_user
      - DB_PASSWORD=cybershield_secure_password_2026
      - DB_NAME=cybershield_db
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybershield-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-go
      - backend-python

volumes:
  postgres_data:
