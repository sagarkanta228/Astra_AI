version: '3.8'

services:
  backend-django:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: astra-django-backend
    ports:
      - "8000:8000"
    environment:
      - USE_NEON=false
      - USE_SQLITE=true
    volumes:
      - ./backend-django:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astra-react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-django
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
