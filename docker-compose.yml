version: '3.8'

services:
  backend-django:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: astra-django-backend
    ports:
      - "8000:8000"
    environment:
      - USE_NEON=false
      - USE_SQLITE=true
      - NEON_DATABASE_URL=postgresql://neondb_owner:npg_1Ze9uYGTfDcn@ep-dark-truth-b4xvk6bl-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
    volumes:
      - ./backend-django:/app

  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: astra-next-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-django
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
